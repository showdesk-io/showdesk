# =============================================================================
# Showdesk Production Docker Compose
# =============================================================================
# Deploy with `docker compose` directly (see deploy/README.md for an
# SSH + GitHub Actions setup) or as a Portainer stack.
#
# Profiles:
#   - (default)  Application services only. PostgreSQL, Redis, S3 are external.
#   - local      Also include PostgreSQL, Redis, and MinIO containers.
#   - redis      Only a local Redis (managed PostgreSQL + S3, local cache/broker).
#   - postgres   Only a local PostgreSQL (WAL-G image, see deploy/postgres/).
#   - backup     WAL-G base-backup sidecar for the local PostgreSQL (PITR).
#   - portainer  Auto-update sidecar that redeploys a Portainer stack.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d                  # managed DB
#   docker compose -f docker-compose.prod.yml --profile local up -d  # all-in-one
#
# Image version: set IMAGE_TAG to a git short SHA to pin a release
# (default: latest).
# =============================================================================

# -- Shared environment for all backend services -----------------------------
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  DATABASE_URL: ${DATABASE_URL:-postgres://showdesk:showdesk@postgres:5432/showdesk}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-showdesk-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
  SITE_URL: ${SITE_URL:-https://localhost}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.example.com}
  EMAIL_PORT: ${EMAIL_PORT:-465}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-True}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@showdesk.io}
  MAILJET_API_KEY: ${MAILJET_API_KEY:-}
  MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}

# -- WAL-G (PITR backups of the local PostgreSQL, see deploy/postgres/) -------
x-walg-env: &walg-env
  WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
  AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_ACCESS_KEY:-}
  AWS_ENDPOINT: ${WALG_S3_ENDPOINT:-}
  AWS_REGION: ${WALG_S3_REGION:-us-east-1}
  AWS_S3_FORCE_PATH_STYLE: ${WALG_S3_FORCE_PATH_STYLE:-true}
  WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-brotli}
  WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:-}
  WALG_LIBSODIUM_KEY_TRANSFORM: ${WALG_LIBSODIUM_KEY_TRANSFORM:-hex}

configs:
  caddyfile:
    content: |
      ${SHOWDESK_DOMAIN:-localhost} {
        ${CADDY_TLS_DIRECTIVE:-}
        header {
          X-Content-Type-Options nosniff
          X-Frame-Options DENY
          Referrer-Policy strict-origin-when-cross-origin
          Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
          -Server
        }

        handle /api/* {
          reverse_proxy backend:8000
        }

        handle /admin/* {
          reverse_proxy backend:8000
        }

        handle /static/* {
          reverse_proxy backend:8000
        }

        handle /ws/* {
          reverse_proxy backend:8000
        }

        handle /cdn/* {
          uri strip_prefix /cdn
          reverse_proxy widget:80
        }

        handle /widget-demo* {
          rewrite /widget-demo /widget-demo.html
          reverse_proxy widget:80
        }

        handle {
          reverse_proxy frontend:80
        }
      }

services:
  # ---------------------------------------------------------------------------
  # Caddy (reverse proxy — automatic HTTPS via Let's Encrypt)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    ports:
      - "${EXTERNAL_IP:-0.0.0.0}:80:80"
      - "${EXTERNAL_IP:-0.0.0.0}:443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Optional custom certificate (e.g. a Cloudflare Origin certificate).
      # Drop cert.pem + key.pem here and set
      # CADDY_TLS_DIRECTIVE="tls /etc/caddy/certs/cert.pem /etc/caddy/certs/key.pem".
      - ./certs:/etc/caddy/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      widget:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Database Migrations (one-shot, runs before app services)
  # ---------------------------------------------------------------------------
  migrate:
    image: ghcr.io/showdesk-io/showdesk-backend:${IMAGE_TAG:-latest}
    command: migrate
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    depends_on:
      redis:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false

  # ---------------------------------------------------------------------------
  # Django Backend (Gunicorn + Uvicorn for WebSockets)
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/showdesk-io/showdesk-backend:${IMAGE_TAG:-latest}
    command: server
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery-worker:
    image: ghcr.io/showdesk-io/showdesk-backend:${IMAGE_TAG:-latest}
    command: worker
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Celery Beat (scheduler)
  # ---------------------------------------------------------------------------
  celery-beat:
    image: ghcr.io/showdesk-io/showdesk-backend:${IMAGE_TAG:-latest}
    command: beat
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    # Exactly one beat must run per database. Set CELERY_BEAT_REPLICAS=0 on
    # a node that shares its database with another running stack.
    deploy:
      replicas: ${CELERY_BEAT_REPLICAS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # React Frontend (Nginx serving static build)
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/showdesk-io/showdesk-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Widget (Nginx serving built widget JS)
  # ---------------------------------------------------------------------------
  widget:
    image: ghcr.io/showdesk-io/showdesk-widget:${IMAGE_TAG:-latest}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Auto-update (profile: portainer): check for new :latest images and
  # trigger a Portainer stack redeploy. Not needed when deploying with
  # `docker compose` over SSH. Checks every CHECK_INTERVAL seconds.
  # ---------------------------------------------------------------------------
  auto-update:
    image: ghcr.io/showdesk-io/showdesk-auto-update:latest
    profiles: [portainer]
    environment:
      PORTAINER_URL: ${PORTAINER_URL:-}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
      PORTAINER_STACK_ID: ${PORTAINER_STACK_ID:-}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-1}
      WATCHED_IMAGES: ${WATCHED_IMAGES:-ghcr.io/showdesk-io/showdesk-backend:latest ghcr.io/showdesk-io/showdesk-frontend:latest ghcr.io/showdesk-io/showdesk-widget:latest}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-300}
    volumes:
      - auto_update_state:/state
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (profile: local)
  # When using managed Redis, set REDIS_URL / CELERY_BROKER_URL.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    profiles: [local, redis]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # PostgreSQL (profile: local)
  # When using managed PostgreSQL, set DATABASE_URL.
  # ---------------------------------------------------------------------------
  postgres:
    image: ghcr.io/showdesk-io/showdesk-postgres:${POSTGRES_IMAGE_TAG:-17}
    profiles: [local, postgres]
    command: >-
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='walg-archive %p'
      -c archive_timeout=${WALG_ARCHIVE_TIMEOUT:-60}
    environment:
      <<: *walg-env
      POSTGRES_DB: ${POSTGRES_DB:-showdesk}
      POSTGRES_USER: ${POSTGRES_USER:-showdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-showdesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-showdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # WAL-G base backups (profile: backup) -- requires WALG_S3_PREFIX.
  # Together with continuous WAL archiving this enables point-in-time
  # recovery; see deploy/postgres/README.md for the restore procedure.
  # ---------------------------------------------------------------------------
  postgres-backup:
    image: ghcr.io/showdesk-io/showdesk-postgres:${POSTGRES_IMAGE_TAG:-17}
    profiles: [backup]
    user: postgres
    entrypoint: ["walg-backup-loop"]
    environment:
      <<: *walg-env
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-showdesk}
      PGPASSWORD: ${POSTGRES_PASSWORD:-showdesk}
      PGDATABASE: ${POSTGRES_DB:-showdesk}
      PGDATA: /var/lib/postgresql/data
      WALG_BACKUP_INTERVAL: ${WALG_BACKUP_INTERVAL:-86400}
      WALG_RETAIN_FULL: ${WALG_RETAIN_FULL:-7}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO S3 (profile: local)
  # When using managed S3, set S3_* vars.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio
    profiles: [local]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-showdesk}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-showdesk-secret}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  auto_update_state:
  redis_data:
  postgres_data:
  minio_data:
