server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The conversation page's URL holds its link's token: no Referer may carry it.
    # An add_header here drops the server's, hence the repeated security headers.
    location /c/ {
        try_files $uri /index.html;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Browsers ask for /favicon.ico whatever the page declares: the brand icon.
    # Not immutable, as its URL never changes.
    location = /favicon.ico {
        try_files /favicon.svg =404;
        expires 1d;
    }

    # Cache static assets
    location ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
