name: Widget Publish

on:
  push:
    tags:
      - "widget-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Widget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: widget-dist
          path: widget/dist

  publish-npm:
    name: Publish to npmjs.com
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v8
        with:
          name: widget-dist
          path: widget/dist

      - name: Publish to npmjs.com (OIDC, no token)
        run: npm publish --access public --provenance

