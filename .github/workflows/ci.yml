name: CI

on:
  pull_request:
    branches: [main, develop]
  # Pushes to main / develop run CI through release.yml (CI -> images -> deploy).
  workflow_call:

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "26"

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + test
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install "ruff>=0.17,<0.18"

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: showdesk_test
          POSTGRES_USER: showdesk
          POSTGRES_PASSWORD: showdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://showdesk:showdesk@localhost:5432/showdesk_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.development

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          cd backend
          python -m pytest -v --tb=short

  # ---------------------------------------------------------------------------
  # Frontend: lint + type check + test + build
  # (job id / name kept stable so existing required checks keep matching)
  # ---------------------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Test
        run: |
          cd frontend
          npm test

      - name: Build
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # Widget: type check + tests + build
  # ---------------------------------------------------------------------------
  widget-build:
    name: Widget Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: widget/node_modules
          key: node-widget-${{ hashFiles('widget/package-lock.json', 'widget/package.json') }}

      - name: Install dependencies
        run: |
          cd widget
          npm install

      - name: Type check
        run: |
          cd widget
          npx tsc --noEmit

      - name: Run tests
        run: |
          cd widget
          npm test

      - name: Build widget
        run: |
          cd widget
          npm run build
